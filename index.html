<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイト編集AI</title>
<style>
  :root {
    --void: #060011;
    --deep: #0d0020;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --spirit: #7c3aed;
    --spirit-light: #a78bfa;
    --gold: #f59e0b;
    --aurora: #c084fc;
    --text: #e2d9f3;
    --muted: #8b7aaa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--void);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(124,58,237,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(192,132,252,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Login screen ── */
  #login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: var(--void);
  }

  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    backdrop-filter: blur(20px);
  }

  .login-orb {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #c084fc, #7c3aed, #4c1d95);
    margin: 0 auto 24px;
    box-shadow: 0 0 40px rgba(124,58,237,0.5);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .login-box h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #c084fc, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-box p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 28px;
  }

  .login-box input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }

  .login-box input:focus { border-color: var(--spirit-light); }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--spirit), #4c1d95);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .login-btn:hover { opacity: 0.9; }
  .login-btn:active { transform: scale(0.98); }

  .login-error {
    color: #f87171;
    font-size: 0.82rem;
    margin-top: 10px;
    min-height: 20px;
  }

  /* ── Main layout ── */
  #app {
    display: none;
    flex-direction: column;
    height: 100dvh;
    position: relative;
    z-index: 1;
  }

  #app.visible { display: flex; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(6,0,17,0.8);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }

  .header-orb {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #c084fc, #7c3aed);
    box-shadow: 0 0 16px rgba(124,58,237,0.5);
    flex-shrink: 0;
  }

  .header-title {
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, #c084fc, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-site {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .site-badge {
    font-size: 0.78rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .site-link {
    font-size: 0.78rem;
    color: var(--spirit-light);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 20px;
    transition: background 0.2s;
  }

  .site-link:hover { background: rgba(167,139,250,0.1); }

  /* ── Quick actions ── */
  .quick-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    background: rgba(6,0,17,0.5);
  }

  .quick-actions::-webkit-scrollbar { display: none; }

  .qa-btn {
    white-space: nowrap;
    padding: 6px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .qa-btn:hover {
    background: rgba(124,58,237,0.2);
    border-color: rgba(124,58,237,0.5);
    color: var(--aurora);
  }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(124,58,237,0.3) transparent;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 720px;
  }

  .msg.user { flex-direction: row-reverse; margin-left: auto; }
  .msg.assistant { margin-right: auto; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
  }

  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--gold), #d97706);
  }

  .msg.assistant .msg-avatar {
    background: radial-gradient(circle at 40% 35%, #c084fc, #7c3aed);
    box-shadow: 0 0 12px rgba(124,58,237,0.4);
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.65;
    max-width: calc(100% - 44px);
    word-break: break-word;
  }

  .msg.user .msg-bubble {
    background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(76,29,149,0.4));
    border: 1px solid rgba(167,139,250,0.25);
    border-radius: 16px 4px 16px 16px;
  }

  .msg.assistant .msg-bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px 16px 16px 16px;
  }

  .msg-bubble strong { color: var(--aurora); }
  .msg-bubble code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.83em;
    font-family: monospace;
  }

  /* thinking indicator */
  .thinking {
    display: flex;
    gap: 5px;
    padding: 14px 16px;
  }

  .thinking span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--spirit-light);
    animation: blink 1.2s infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* tool use indicator */
  .tool-indicator {
    font-size: 0.78rem;
    color: var(--spirit-light);
    padding: 6px 12px;
    background: rgba(124,58,237,0.1);
    border: 1px solid rgba(124,58,237,0.2);
    border-radius: 8px;
    margin-top: 6px;
    display: inline-block;
  }

  /* ── Input area ── */
  .input-area {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: rgba(6,0,17,0.8);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 0.95rem;
    resize: none;
    outline: none;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    transition: border-color 0.2s;
  }

  #user-input:focus { border-color: var(--spirit-light); }
  #user-input::placeholder { color: var(--muted); }

  #send-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--spirit), #4c1d95);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #send-btn svg { width: 18px; height: 18px; fill: white; }

  .input-hint {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 6px;
    padding: 0 2px;
  }

  /* ── Markdown-like formatting ── */
  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 6px 0; }
  .msg-bubble li { margin-bottom: 3px; }
  .msg-bubble h3 { font-size: 0.95rem; color: var(--aurora); margin: 10px 0 4px; }

  /* ── Welcome message ── */
  .welcome {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
  }

  .welcome-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }

  .welcome h2 {
    font-size: 1.1rem;
    color: var(--text);
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 0.85rem;
    line-height: 1.7;
    max-width: 320px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-orb"></div>
    <h1>サイト編集AI</h1>
    <p>AIと会話しながらサイトを編集できます</p>
    <input type="password" id="pw-input" placeholder="パスワードを入力" autocomplete="current-password">
    <button class="login-btn" onclick="login()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <header>
    <div class="header-orb"></div>
    <div class="header-title">サイト編集AI</div>
    <div class="header-site">
      <span class="site-badge" id="site-name">守護神サイト</span>
      <a class="site-link" id="site-url" href="https://unarai.vercel.app" target="_blank">サイトを開く ↗</a>
    </div>
  </header>

  <div class="quick-actions">
    <button class="qa-btn" onclick="quickSend('サイト全体のファイル一覧を教えて')">📂 ファイル一覧</button>
    <button class="qa-btn" onclick="quickSend('トップページ（index.html）の内容を確認して')">🏠 トップページ確認</button>
    <button class="qa-btn" onclick="quickSend('スタイル（styles.css）を確認して')">🎨 デザイン確認</button>
    <button class="qa-btn" onclick="quickSend('占い知識データベースの内容を確認して')">🔮 占い知識を見る</button>
    <button class="qa-btn" onclick="quickSend('守護神の一覧と説明文を確認したい')">⚡ 守護神リスト</button>
    <button class="qa-btn" onclick="quickSend('サイトの現在の状態と編集できる内容を教えて')">ℹ️ サイト情報</button>
  </div>

  <div id="chat">
    <div class="welcome">
      <div class="welcome-icon">✨</div>
      <h2>何を変えたいですか？</h2>
      <p>「トップページの文章を明るくして」「守護神の説明をもっと詳しくして」など、日本語でそのまま話しかけてください。</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" rows="1" placeholder="例: トップページのキャッチコピーをもっとかっこよくして" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint">Enterで送信 / Shift+Enterで改行</div>
  </div>
</div>

<script>
  let PASSWORD = '';
  let history = [];
  let isLoading = false;

  // ── Login ──
  function login() {
    const pw = document.getElementById('pw-input').value.trim();
    if (!pw) return;
    PASSWORD = pw;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('user-input').focus();
  }

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ── Quick send ──
  function quickSend(text) {
    if (isLoading) return;
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  // ── Textarea auto resize ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Append message ──
  function appendMsg(role, text) {
    const chat = document.getElementById('chat');
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '👤' : '✨';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatText(text);

    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function appendThinking() {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'thinking-msg';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '✨';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';

    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-msg');
    if (el) el.remove();
  }

  // ── Simple markdown formatter ──
  function formatText(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/gs, m => `<ul>${m}</ul>`)
      .replace(/\n{2,}/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^(?!<[hul])/, '<p>')
      .replace(/(?<![>])$/, '</p>');
  }

  // ── Send message ──
  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || isLoading) return;

    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    appendMsg('user', text);
    appendThinking();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: history,
          password: PASSWORD,
          siteId: 'guardian'
        })
      });

      const data = await res.json();
      removeThinking();

      if (!res.ok) {
        if (res.status === 401) {
          appendMsg('assistant', '❌ パスワードが違います。ページを更新して再度ログインしてください。');
        } else {
          appendMsg('assistant', `❌ エラーが発生しました: ${data.error || '不明なエラー'}`);
        }
      } else {
        appendMsg('assistant', data.reply);
        history = data.history || history;
      }
    } catch (e) {
      removeThinking();
      appendMsg('assistant', '❌ 通信エラーが発生しました。インターネット接続を確認してください。');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('user-input').focus();
  }
</script>
</body>
</html>
